# stackcheck.conf — overlay that reports live thread stack high-water marks.
#
# Layer this on ANY build whose stack budget you want to validate — most
# importantly after changing optimization level, which shifts stack usage and
# has caused a hard-to-diagnose overflow on this project before (see
# CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE and CONFIG_MAIN_STACK_SIZE in prj.conf,
# both of which exist because of exactly that).
#
#   cmake -B build_stackcheck -DBOARD=nrf52833_ders/nrf52833 \
#         -DBOARD_ROOT=/home/anders/Documents/NCS/WWD-n \
#         -DEXTRA_CONF_FILE=stackcheck.conf -GNinja
#   cmake --build build_stackcheck
#
# The analyzer prints every thread — including the ones the application does
# not create (main, idle, sysworkq, the two USB workqueues, logging) — every
# 15 s over the console. Those system threads are the ones that bit us before,
# so read the whole table, not just the four app threads.
#
# Exercise the device while it runs: press every button, walk the whole menu,
# let the display sleep and wake, run a USB dump. Peak stack is only as high as
# the deepest path you actually took.
#
# This overlay costs flash and RAM of its own (~2 KB stack for the analyzer
# thread) — it is a measurement tool, never part of a shipped image.

CONFIG_THREAD_NAME=y
CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_LOG=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=15
CONFIG_THREAD_ANALYZER_AUTO_STACK_SIZE=2048

# RTT up-buffer: the default 1024 B with NO_BLOCK_SKIP silently DROPS most of
# the analyzer's burst (measured 2026-08-24 on SN1 — only 1 of ~6 report cycles
# survived, and individual threads went missing from the table mid-report).
# The analyzer prints two lines per thread across ~11 threads at once, which is
# several KB in one go. 8192 costs RAM this build has spare.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# Log buffer: the REAL reason analyzer rows go missing (diagnosed 2026-08-24 on
# SN1 — ui_refresh and button_handler were absent from every report while
# sensor_update and protocol appeared, with "--- N messages dropped ---" in the
# stream). The default 1024 B cannot hold one analyzer burst, so Zephyr's
# logging subsystem drops the tail of each report BEFORE it reaches any backend.
# Widening RTT alone does not fix this. prj.conf keeps a commented-out
# CONFIG_LOG_BUFFER_SIZE=2048 line; 2048 is still not enough for this burst.
CONFIG_LOG_BUFFER_SIZE=8192
