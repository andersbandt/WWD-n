# debug.conf — overlay that restores the pre-2026-08-24 unoptimized build.
#
# prj.conf is now the production baseline (CONFIG_SIZE_OPTIMIZATIONS=y). Layer
# this on top whenever you need to single-step: at -Os, GCC reorders and inlines
# aggressively, locals live in registers rather than on the stack, and GDB will
# report <optimized out> for variables that were readable before.
#
#   cmake -B build_dbg -DBOARD=nrf52833_ders/nrf52833 \
#         -DBOARD_ROOT=/home/anders/Documents/NCS/WWD-n \
#         -DEXTRA_CONF_FILE=debug.conf -GNinja
#   cmake --build build_dbg
#
# Cost, measured on tree e13f8aa: +212 KB of flash (36.4% -> 77.0% of the part).
# A build with this overlay CANNOT also enable Bluetooth — the two together
# overflow the 512 KB part and will not link.
#
# CLAUDE.md's "always do a pristine build" rule applies: use a separate build
# directory rather than reconfiguring an existing one.

CONFIG_SIZE_OPTIMIZATIONS=n
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=y
