# Diagnostics-only overlay: disables Bluetooth, and with it MPSL.
#
# MPSL initialises at PRE_KERNEL_1 and blocks forever if the requested LF clock
# source never starts. On a board whose RV-3028 has gone silent — SN3 has done
# this before, see project_sn3_rv3028_silent — the CLKOUT that feeds LFCLK is
# dead, so the board hangs in mpsl_init() before USB or any application code
# runs. Zephyr's own clock setup degrades to the internal RC; MPSL does not.
#
# Layer this on when the target is needed for on-chip diagnostics and the RTC
# cannot be power-cycled. Never a production configuration.
CONFIG_BT=n
