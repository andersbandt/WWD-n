# stack_usage.conf — emit per-function stack frame sizes (.su files) for the
# static worst-case depth analysis in debug/stack_depth.py.
#
#   cmake -B build_su -DBOARD=nrf52833_ders/nrf52833 \
#         -DBOARD_ROOT=/home/anders/Documents/NCS/WWD-n \
#         -DEXTRA_CONF_FILE=debug/stack_usage.conf -GNinja
#   cmake --build build_su
#   python3 debug/stack_depth.py build_su/zephyr/zephyr.elf build_su
#
# Layer debug.conf alongside this to analyse the unoptimized build instead.
# Results and caveats: debug/stack_budget.md
CONFIG_COMPILER_OPT="-fstack-usage"
