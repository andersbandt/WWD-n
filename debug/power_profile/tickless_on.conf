# Overlay for the tickless A/B (item 5). Kept as a separate overlay rather than
# editing prj.conf, which sets CONFIG_TICKLESS_KERNEL=n deliberately to work
# around a k_msleep()-never-wakes race -- and whose comments must be preserved.
#
# Build with:
#   cmake -B build_pp_tickless -DBOARD=nrf52833_ders/nrf52833 \
#     -DBOARD_ROOT=/home/anders/Documents/NCS/WWD-n -DPOWER_PROFILE_BUILD=ON \
#     -DEXTRA_CONF_FILE=debug/power_profile/tickless_on.conf -GNinja
#
# WARNING: this re-introduces the race prj.conf disabled tickless to avoid.
# It is for measurement only -- do not ship it without re-testing that hang.
CONFIG_TICKLESS_KERNEL=y
