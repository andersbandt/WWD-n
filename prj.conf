
# set clocking
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# enable peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
# CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=n

# enable console for output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# configure log
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
    # log level (0=none, 1=ERR, 2=WRN, 3=INF, 4=DBG)
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SPI_LOG_LEVEL_DBG=n
#CONFIG_LOG_BUFFER_SIZE=2048

# enable higher-level systems
CONFIG_SENSOR=y
CONFIG_DISPLAY=n

# enable kernel features for RTOS threading
CONFIG_POLL=y

# enable CRC for NVS metadata integrity
CONFIG_CRC=y

# enable heap memory allocation for k_malloc
CONFIG_HEAP_MEM_POOL_SIZE=4096


# fucking memory debug
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_INIT_STACKS=y # this one is for printing thread stack space (or one of ones required?)


# Build with debug symbols
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=y
