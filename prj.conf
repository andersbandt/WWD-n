
# set clocking
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y

# enable peripherals
CONFIG_COUNTER=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y
CONFIG_RTC=y
CONFIG_RTC_RV3028=y
# CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=n

# USB CDC console (nRF52833 hardware — no UART pins on QDAA package)
# CONFIG_SERIAL=y is required to enable the UART subsystem that CDC ACM depends on,
# even though there is no physical UART on this board.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# enable console for output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# configure log
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
    # log level (0=none, 1=ERR, 2=WRN, 3=INF, 4=DBG)
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_SPI_LOG_LEVEL_INF=y
#CONFIG_LOG_BUFFER_SIZE=2048

# enable higher-level systems
CONFIG_SENSOR=y
CONFIG_DISPLAY=n

# Bluetooth — uncomment to enable; call ble_init() in main.c
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="WWD"
# CONFIG_BT_DEVICE_APPEARANCE=192
# CONFIG_BT_MAX_CONN=1
# CONFIG_BT_SMP=y

# enable kernel features for RTOS threading
CONFIG_POLL=y

# enable CRC for NVS metadata integrity
CONFIG_CRC=y

# enable heap memory allocation for k_malloc
CONFIG_HEAP_MEM_POOL_SIZE=4096


# fucking memory debug
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_INIT_STACKS=y # this one is for printing thread stack space (or one of ones required?)


# Build with debug symbols
CONFIG_DEBUG_OPTIMIZATIONS=y
CONFIG_NO_OPTIMIZATIONS=y
