
# set clocking
# nRF52833 hardware has a 32kHz crystal on P0.00/P0.01 — use XTAL for accuracy.
# The board defconfig sets XTAL=y/RC=n, but prj.conf overrides take precedence,
# so these must be explicit here.
# BRING-UP 2026-07-23: the 32kHz crystal is NOT oscillating on this board —
# LFCLKSTAT reads SRC=RC and EVENTS_LFCLKSTARTED never fires, so boot hangs
# forever in lfclk_spinwait() at PRE_KERNEL_2 and never reaches main().
# Running on the internal RC until the XTAL is fixed in hardware.
# Restore these three lines once the crystal is verified:
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
#CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
# BRING-UP 2026-07-25: no crystal is populated on this board at all. Instead
# RV-3028 RTC_CLKOUT drives XL1 (P0.00) at 32.768 kHz — verified on SN2 by
# counting edges on P0.00 (~32.4 kHz measured, polling-loop error accounts for
# the shortfall) with CLKOUT reg 0x35 = 0xC0 (CLKOE=1, FD=0). CLKOUT is stored
# in the RV-3028's EEPROM, so it runs from POR without needing I2C first.
# FULL_SWING (not LOW_SWING) because CLKOUT is a push-pull CMOS output.
# Revert to the RC lines below if the LF source is ever lost.
# BRING-UP 2026-07-27: chased a silent boot hang most of a session, initially
# blamed on this EXT_FULL_SWING/CLKOUT hand-off (LFCLKSTAT was observed
# flipping SRC mid-run). Forcing RC + disabling RC_CALIBRATION here did NOT
# fix it — real cause turned out to be the MCP23008 driver's auto-init
# (see nrf52833_ders.dts, mcp23008 node disabled) corrupting a kernel
# spinlock when its I2C write NACKs (device not populated on this board).
# Restoring the original CLKOUT config now that the actual cause is disabled
# — see nvs_notes.md / thread_bringup_crash memory for the full story.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n
CONFIG_CLOCK_CONTROL_NRF_K32SRC_EXT_FULL_SWING=y
# BISECT 2026-07-27 (session 2): re-tested with RC_CALIBRATION=y now that
# MCP23008 is disabled — still hangs (same idle/spinlock signature, ~4s in,
# right after display_phase() before nvs_phase()). So RC calibration is a
# second, independent contributor, not just a red herring from the MCP bug.
# Leave off until this is understood separately.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC_CALIBRATION=n
# The default clock startup policy is SYSTEM_CLOCK_WAIT_FOR_STABILITY, which
# spins in lfclk_spinwait() until the *target* source is the running one — that
# is what hung boot on 2026-07-23 with the dead crystal, and it would equally
# hang a board whose RV-3028 has no CLKOUT programmed yet.
# WAIT_FOR_AVAILABILITY instead uses nrfx's two-stage LFXO start: LFCLK comes up
# on the internal RC immediately, boot continues, and the hardware switches to
# RTC_CLKOUT when it is ready. If CLKOUT never appears the system just keeps
# running on the RC. One image boots any board, and clock_control still knows
# the real source — which matters for BLE's LF accuracy.
CONFIG_SYSTEM_CLOCK_WAIT_FOR_AVAILABILITY=y

# BISECT 2026-07-27 (session 2): even with MCP23008 disabled and RC_CALIBRATION
# off, a rare k_msleep()-never-wakes hang can still happen at effectively any
# sleep call site (caught one inside cdc_write()'s k_msleep(5), nothing
# special about it) — looks like a genuine race in the tickless-kernel RTC1
# tick/timeout path rather than anything driver-specific. Testing periodic
# tick instead of tickless to see if it sidesteps the race. Revert to
# tickless (delete this line) if it doesn't help — periodic ticking costs
# more power, only worth keeping if it actually fixes this.
CONFIG_TICKLESS_KERNEL=n

# Pinned explicitly (was an unset default that happened to resolve to 128)
# because dump_decoder.py in the companion wwd_gui_api repo hardcodes this
# rate to reconstruct seconds_since_boot from on-flash dt_ticks — a silent
# change here would desync that conversion again. See dump_decoder.py's
# TICKS_PER_SEC constant if this ever needs to change.
CONFIG_SYS_CLOCK_TICKS_PER_SEC=128

# enable peripherals
CONFIG_COUNTER=y
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_NRFX_SAADC=y
CONFIG_PWM=y
CONFIG_RTC=y
CONFIG_RTC_RV3028=y
# CONFIG_SOC_NRF52832_ALLOW_SPIM_DESPITE_PAN_58=n

# USB CDC console (nRF52833 hardware — no UART pins on QDAA package)
# CONFIG_SERIAL=y is required to enable the UART subsystem that CDC ACM depends on,
# even though there is no physical UART on this board.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
# cdc_acm_uart1 (src/comm/protocol.c binary command channel) needs interrupt-driven
# RX — the console on cdc_acm_uart0 stays polled/log-only and doesn't need this.
CONFIG_UART_INTERRUPT_DRIVEN=y
# BRING-UP 2026-07-23: init USB explicitly from main() instead of at boot, so the
# usb_enable() return code and the status callback can be logged. Restore to =y
# once enumeration is working:
#CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

# enable console for output
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y

# configure log
CONFIG_LOG=y
# BRING-UP 2026-07-23: the console IS the USB CDC port, so it cannot report its
# own enumeration failure. Log over SEGGER RTT through the J-Link instead
# (read with: JLinkRTTClient, or debug/rtt_log.sh). Restore UART backend and
# drop the RTT block once USB CDC enumerates:
#CONFIG_LOG_BACKEND_UART=y
# NVS BRING-UP 2026-07-26: USB CDC is proven, and nvs_dump() output must be
# readable on the CDC console — UART backend restored per the note above.
# RTT kept as a second backend (was unreadable last session, but harmless).
CONFIG_LOG_BACKEND_UART=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
# NVS BRING-UP 2026-07-26: USB DBG logs would feed back through the CDC log
# backend (log -> USB traffic -> more logs). Cut to ERR while logs ride USB:
#CONFIG_USB_DEVICE_LOG_LEVEL_DBG=y
#CONFIG_USB_DRIVER_LOG_LEVEL_DBG=y
CONFIG_USB_DEVICE_LOG_LEVEL_ERR=y
CONFIG_USB_DRIVER_LOG_LEVEL_ERR=y
    # log level (0=none, 1=ERR, 2=WRN, 3=INF, 4=DBG)
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_KERNEL_LOG_LEVEL_INF=y
CONFIG_SPI_LOG_LEVEL_INF=y
#CONFIG_LOG_BUFFER_SIZE=2048

# enable higher-level systems
CONFIG_SENSOR=y
CONFIG_DISPLAY=n

# Bluetooth — uncomment to enable; call ble_init() in main.c
# CONFIG_BT=y
# CONFIG_BT_PERIPHERAL=y
# CONFIG_BT_DEVICE_NAME="WWD"
# CONFIG_BT_DEVICE_APPEARANCE=192
# CONFIG_BT_MAX_CONN=1
# CONFIG_BT_SMP=y

# enable kernel features for RTOS threading
CONFIG_POLL=y

# enable CRC for NVS metadata integrity
CONFIG_CRC=y

# enable heap memory allocation for k_malloc
CONFIG_HEAP_MEM_POOL_SIZE=4096


# BRING-UP 2026-07-23: default 1024 overflowed during POST_KERNEL/APPLICATION
# driver init (USB device stack + SPI + I2C/MCP23008) with NO_OPTIMIZATIONS=y —
# stack sentinel tripped with PC inside z_main_stack before main() ever ran.
CONFIG_MAIN_STACK_SIZE=4096

# BRING-UP 2026-07-23 (afternoon): same disease as MAIN_STACK_SIZE above — the USB
# workqueue threads overflow their default 1024 B stacks with NO_OPTIMIZATIONS=y +
# USB DBG logging. Usage fault with the exception frame at the bottom of
# usbd_work_queue_stack, then an assert/log recursion wedge, all before USBPULLUP
# is ever set (board is bus-powered, so VBUS events start the instant usb_enable()
# runs). Defaults are likely fine once NO_OPTIMIZATIONS/DBG logging are reverted.
CONFIG_USB_WORKQUEUE_STACK_SIZE=4096
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=4096

# 2026-08-01: same disease as the USB workqueue bumps above, this time on the
# default SYSTEM workqueue. The MCP23008 GPIO driver defers its interrupt
# handling (mcp23xxx_work_handler — I2C reads to figure out which button pin
# changed, dispatch the per-pin callback) onto k_sys_work_q, whose default
# stack (~1024 B) overflows under NO_OPTIMIZATIONS. Caught live via GDB:
# CFSR=0x92 (MemManage, MSTKERR — MPU stack-guard hit during exception
# stacking), MMFAR pointing at the very base of sys_work_q_stack. This is
# the actual cause of the board resetting on every real button press —
# button_handler_thread/ui_refresh_thread stack bumps and display-code
# locking earlier today were legitimate fixes for other latent bugs but
# didn't touch this thread.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# fucking memory debug
CONFIG_STACK_SENTINEL=y
CONFIG_ASSERT=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_ASSERT_VERBOSE=y
CONFIG_INIT_STACKS=y # this one is for printing thread stack space (or one of ones required?)


# Build with debug symbols
# PRODUCTION BUILD 2026-08-24: these two are now the DEBUG setting, not the
# default. Measured on this tree at e13f8aa: NO_OPTIMIZATIONS costs 212 KB of
# flash (403,453 B / 77.0% of the part, vs 190,560 B / 36.4% at -Os) and burns
# CPU continuously. It also makes BLE physically impossible — the BT peripheral
# stack is +136 KB, and 403K + 136K overflows the 512 KB part, so it will not
# link. Restore these two lines (or better, build with debug.conf, which does
# exactly that) whenever single-stepping matters more than size:
#CONFIG_DEBUG_OPTIMIZATIONS=y
#CONFIG_NO_OPTIMIZATIONS=y
#
# -Os rather than -O2: flash is the constrained resource here, not cycles.
# The stack-usage risk this creates is real and is why the "fucking memory
# debug" block above (STACK_SENTINEL / ASSERT / INIT_STACKS) stays ON in
# production for now — those are the net under exactly this change. See
# debug/stack_budget.md for the measured high-water marks.
CONFIG_SIZE_OPTIMIZATIONS=y
